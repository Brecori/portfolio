<svg width="960" height="960" viewBox="0 0 960 960" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="coreGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(480 480) rotate(90) scale(360)">
      <stop stop-color="#A855F7" stop-opacity="0.42"/>
      <stop offset="0.46" stop-color="#A855F7" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#101010" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="primaryLine" x1="120" y1="140" x2="840" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6D28D9" stop-opacity="0.38"/>
      <stop offset="0.48" stop-color="#A855F7" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#6D28D9" stop-opacity="0.34"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.658824 0 0 0 0 0.333333 0 0 0 0 0.968627 0 0 0 0.55 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    .draw {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: draw-line 2.8s ease-out forwards;
    }

    .node {
      opacity: 0;
      animation: pulse-node 0.6s ease-out forwards;
    }

    .surface {
      opacity: 0;
      animation: fade-surface 0.8s ease-out 1.8s forwards;
    }

    .d1 { animation-delay: 0s; }
    .d2 { animation-delay: 0.12s; }
    .d3 { animation-delay: 0.24s; }
    .d4 { animation-delay: 0.36s; }
    .d5 { animation-delay: 0.48s; }
    .d6 { animation-delay: 0.6s; }
    .d7 { animation-delay: 0.72s; }
    .d8 { animation-delay: 0.84s; }
    .d9 { animation-delay: 0.96s; }
    .d10 { animation-delay: 1.08s; }
    .d11 { animation-delay: 1.2s; }
    .d12 { animation-delay: 1.32s; }
    .d13 { animation-delay: 1.44s; }
    .d14 { animation-delay: 1.56s; }
    .d15 { animation-delay: 1.68s; }
    .d16 { animation-delay: 1.8s; }
    .d17 { animation-delay: 1.92s; }
    .d18 { animation-delay: 2.04s; }
    .d19 { animation-delay: 2.16s; }
    .d20 { animation-delay: 2.28s; }

    @keyframes draw-line {
      from {
        stroke-dashoffset: 1;
      }

      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes pulse-node {
      from {
        opacity: 0;
        transform: scale(0.75);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes fade-surface {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .draw {
        animation: none;
        stroke-dashoffset: 0;
      }

      .node,
      .surface {
        animation: none;
        opacity: 1;
      }
    }
  </style>

  <rect class="surface" width="960" height="960" fill="url(#coreGlow)"/>

